[project]
name = "tool-calling-agent-interview"
version = "0.1.0"
description = "A small interview-ready agent runtime with synchronous tool calling."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
tool-agent = "tool_agent.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
